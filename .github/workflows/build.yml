name: build

on: [push]

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install MPFR
        run: sudo apt install -y libmpfr6 libmpfr-dev
      - name: Build
        uses: threeal/cmake-action@v2.1.0

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install MPFR
        run: brew install mpfr
      - name: Export homebrew paths
        uses: spezifisch/export-homebrew-build-paths@v1.0.0
      - name: Build
        uses: threeal/cmake-action@v2.1.0

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install MPFR
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-mpfr mingw-w64-x86_64-cmake mingw-w64-x86_64-make mingw-w64-x86_64-gcc
      - name: Set MinGW environment variables
        run: |
          echo "MPFR_ROOT=C:\msys64\mingw64" >> $env:GITHUB_ENV
          echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH
      - name: Build
        shell: msys2 {0}
        run: |
          cmake -B build -S . -G "MinGW Makefiles"
          cmake --build build

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
          /opt/emsdk/emsdk install latest
          /opt/emsdk/emsdk activate latest
      - name: Cache WebAssembly dependencies
        uses: actions/cache@v4
        with:
          path: wasm-deps
          key: wasm-deps-gmp-6.3.0-mpfr-4.2.2-emscripten-latest
      - name: Install web dependencies
        run: npm install --prefix web
      - name: Test
        run: |
          source /opt/emsdk/emsdk_env.sh
          npm test --prefix web

name: build

on: [push]

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libmpfr6 libmpfr-dev libgtkmm-4.0-dev
          version: 1.0
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('laskin/CMakeLists.txt', 'cmake/add-dependency.cmake') }}
      - name: Build
        uses: threeal/cmake-action@v2.1.0
        with:
          options: |
            LASKIN_ENABLE_2CPP=ON
            LASKIN_ENABLE_GUI=ON

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Cache Homebrew bottles
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-mpfr-gtkmm4
          restore-keys: |
            brew-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install mpfr gtkmm4
      - name: Export homebrew paths
        uses: spezifisch/export-homebrew-build-paths@v1.0.0
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('laskin/CMakeLists.txt', 'cmake/add-dependency.cmake') }}
      - name: Build
        uses: threeal/cmake-action@v2.1.0
        with:
          options: |
            LASKIN_ENABLE_2CPP=ON
            LASKIN_ENABLE_GUI=ON

  build-windows-msvc:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Cache vcpkg
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: vcpkg
          key: vcpkg-Windows-msvc-${{ env.VCPKG_DEFAULT_TRIPLET }}-mpfr-4.2.2
          restore-keys: |
            vcpkg-Windows-msvc-${{ env.VCPKG_DEFAULT_TRIPLET }}-
      - name: Setup vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Install MPFR
        run: .\vcpkg\vcpkg.exe install mpfr --clean-after-build
      - name: Export MPFR_ROOT
        run: echo "MPFR_ROOT=${{ github.workspace }}/vcpkg/installed/x64-windows" >> $env:GITHUB_ENV
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-Windows-msvc-${{ hashFiles('laskin/CMakeLists.txt', 'cmake/add-dependency.cmake') }}
          restore-keys: |
            fetchcontent-Windows-msvc-
      - name: Build
        uses: threeal/cmake-action@v2.1.0
        with:
          generator: Visual Studio 18 2026
          args: -A x64
          build-args: --config Release
          options: |
            LASKIN_ENABLE_2CPP=ON
            LASKIN_ENABLE_GUI=OFF

  build-windows-mingw:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-Windows-mingw-${{ hashFiles('laskin/CMakeLists.txt', 'cmake/add-dependency.cmake') }}
          restore-keys: |
            fetchcontent-Windows-mingw-
      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-mpfr
      - name: Set MPFR root
        run: echo "MPFR_ROOT=${{ steps.msys2.outputs.msys2-location }}/mingw64" >> $env:GITHUB_ENV
      - name: Add MSYS2 MinGW to PATH
        run: echo "${{ steps.msys2.outputs.msys2-location }}/mingw64/bin" >> $env:GITHUB_PATH
      - name: Build
        shell: msys2 {0}
        run: |
          cmake -B build -S . -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLASKIN_ENABLE_2CPP=ON \
            -DLASKIN_ENABLE_GUI=OFF
          cmake --build build

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: /opt/emsdk
          key: emsdk-${{ runner.os }}-latest
      - name: Install Emscripten
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
          /opt/emsdk/emsdk install latest
          /opt/emsdk/emsdk activate latest
      - name: Activate Emscripten
        run: |
          source /opt/emsdk/emsdk_env.sh
          emcc -v
        shell: bash
      - name: Cache WebAssembly dependencies
        uses: actions/cache@v4
        with:
          path: wasm-deps
          key: wasm-deps-gmp-6.3.0-mpfr-4.2.2-emscripten-latest
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('web/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install web dependencies
        run: npm install --prefix web
      - name: Test
        run: |
          source /opt/emsdk/emsdk_env.sh
          npm test --prefix web
